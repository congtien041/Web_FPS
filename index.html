<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFPS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #0f172a, #020617); 
            min-height: 100vh; 
            overflow-x: hidden;
            color: #f3f4f6;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #06b6d4; } 

        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        @keyframes borderPulseEmerald {
            0%, 100% { border-color: rgba(16, 185, 129, 0.5); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(34, 197, 94, 0.9); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        }
        
        @keyframes borderPulseCyan {
            0%, 100% { border-color: rgba(6, 182, 212, 0.5); box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }
            50% { border-color: rgba(34, 211, 238, 0.9); box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
        }

        .animated-border-emerald { animation: borderPulseEmerald 3s infinite ease-in-out; transition: all 0.3s ease; }
        .animated-border-cyan { animation: borderPulseCyan 3s infinite ease-in-out; transition: all 0.3s ease; }

        @keyframes nameGlowPulse {
            0%, 100% { text-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
            50% { text-shadow: 0 0 15px rgba(16, 185, 129, 0.8), 0 0 20px rgba(16, 185, 129, 0.6); }
        }
        .owner-name { animation: nameGlowPulse 4s infinite ease-in-out; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-row { opacity: 0; animation: fadeInUp 0.4s ease-out forwards; }

        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .bg-glow { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="selection:bg-emerald-500 selection:text-white relative">

    <div class="fixed top-0 left-0 bg-glow"></div>
    <div class="fixed bottom-0 right-0 bg-glow" style="background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, rgba(0,0,0,0) 70%);"></div>

    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div id="login-section" class="flex min-h-screen items-center justify-center p-4 relative z-10">
        <div class="glass-panel p-8 md:p-10 rounded-2xl w-full max-w-md relative overflow-hidden animated-border-emerald border-t-4 border-emerald-500 animate-pop">
            <div class="text-center mb-8 relative">
                <div class="inline-flex p-3 rounded-xl bg-gray-800 border border-gray-700 mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-1 tracking-tight">SimpleFPS</h1>
                <p class="text-gray-400 text-sm font-semibold uppercase tracking-widest">Admin Gateway</p>
            </div>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Tài khoản Quản trị</label>
                    <input type="text" id="admin-user" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-emerald-500 outline-none transition duration-200" autocomplete="off">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Mật khẩu</label>
                    <input type="password" id="admin-pass" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-emerald-500 outline-none transition duration-200">
                </div>

                <div id="login-error" class="hidden p-3 bg-red-500/10 border border-red-500 text-red-400 text-sm rounded-lg text-center animate-pop"></div>

                <button type="button" onclick="window.handleLogin()" id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-emerald-500/30 transition transform active:scale-95 flex justify-center items-center gap-2 mt-4">
                    <span>Mở Khóa Hệ Thống</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-4 md:p-6 lg:p-8 relative z-10 animate-pop">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center shadow-lg animated-border-emerald border-l-4 border-emerald-500 gap-4">
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-inner flex-shrink-0">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-emerald-400">Hệ Thống Quản Trị</h1>
                    <p class="text-xs md:text-sm text-gray-400 mt-1 flex items-center flex-wrap gap-1.5 font-mono">
                        <span>Thiết kế bởi:</span>
                        <span class="text-emerald-400 font-bold tracking-wider owner-name">TranCongTien</span>
                    </p>
                </div>
            </div>
            
            <div class="flex gap-3 w-full md:w-auto justify-end">
                <button onclick="window.fetchPlayers()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 hover:text-white px-4 py-2.5 rounded-lg border border-gray-600 shadow transition active:scale-95 flex items-center gap-2 group whitespace-nowrap">
                    <svg class="w-4 h-4 text-emerald-500 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Làm mới
                </button>
                <button onclick="window.logout()" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-4 py-2.5 rounded-lg border border-red-500/30 hover:border-red-500 shadow transition active:scale-95 flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span class="hidden sm:inline">Đăng Xuất</span>
                </button>
            </div>
        </header>

        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden animated-border-emerald border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-gray-800 text-gray-300 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="p-5 font-semibold">Tài khoản</th>
                            <th class="p-5 font-semibold">Tài Sản (Vàng)</th>
                            <th class="p-5 font-semibold">Xếp Hạng (RP)</th>
                            <th class="p-5 font-semibold">Nhân vật</th>
                            <th class="p-5 font-semibold text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="divide-y divide-gray-700/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-md p-8 animated-border-emerald border border-emerald-500 animate-pop">
            <h2 class="text-2xl font-bold text-emerald-400 mb-6 flex items-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Sửa Thông Tin
            </h2>
            <input type="hidden" id="edit-id">
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Tên hiển thị</label>
                    <input type="text" id="edit-username" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Vàng hiện có</label>
                    <input type="number" id="edit-gold" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-yellow-400 font-bold focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Điểm Rank (RP)</label>
                    <input type="number" id="edit-rank" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-blue-400 font-bold focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition">
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-800">
                <button onclick="window.closeModal('edit-modal')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-5 py-2.5 rounded-lg transition border border-gray-600">Đóng</button>
                <button onclick="window.savePlayer()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2.5 rounded-lg font-bold text-white shadow-lg transition transform active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Xác nhận Lưu
                </button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-3xl p-0 flex flex-col max-h-[85vh] animated-border-cyan border-cyan-500 overflow-hidden animate-pop">
            <div class="bg-gray-800/80 p-5 flex justify-between items-center border-b border-gray-700">
                <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-3" id="history-title">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Lịch sử đấu
                </h2>
                <button onclick="window.closeModal('history-modal')" class="text-gray-400 hover:text-white bg-gray-700 hover:bg-gray-600 rounded-lg p-2 transition-colors border border-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="overflow-y-auto flex-1 p-0 custom-scrollbar bg-gray-900/40">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="text-gray-400 text-xs uppercase tracking-wider sticky top-0 bg-gray-900/90 backdrop-blur z-10 border-b border-gray-800">
                            <th class="p-4 font-semibold pl-6">Kết quả</th>
                            <th class="p-4 font-semibold">Kills / Deaths</th>
                            <th class="p-4 font-semibold">Thời lượng</th>
                            <th class="p-4 font-semibold text-right pr-6">Thời gian</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="divide-y divide-gray-800/80"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- 1. XÓA BỎ MỌI BIẾN LET/CONST BÊN NGOÀI ĐỂ CHỐNG LỖI TRÙNG LẶP ---
        window.dbURL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        
        // TIẾN ĐIỀN KEY CỦA BẠN VÀO ĐÂY (bắt đầu bằng eyJ...):
        window.dbKey = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB'; 

        // --- 2. HÀM THÔNG BÁO ---
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-emerald-600/90 border-emerald-500' : 
                               type === 'error'   ? 'bg-red-600/90 border-red-500' : 'bg-blue-600/90 border-blue-500';

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-lg shadow-lg border ${colorClass} text-white font-medium animate-row pointer-events-auto backdrop-blur-sm`;
            toast.innerHTML = `
                ${type === 'success' ? '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                ${type === 'error' ? '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>' : ''}
                <span class="text-sm">${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- BƯỚC 3 ĐƯỢC CHUYỂN XUỐNG ĐÂY: KHỞI TẠO HỆ THỐNG SAU KHI ĐÃ ĐỌC HẾT CÁC HÀM ---
        window.addEventListener('DOMContentLoaded', () => {
            if (window.supabase) {
                window.db = window.supabase.createClient(window.dbURL, window.dbKey);
                
                // Kiểm tra xem đã đăng nhập chưa
                if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    
                    // Lúc này hàm fetchPlayers đã được định nghĩa ở trên, gọi sẽ không bị lỗi nữa
                    window.fetchPlayers(); 
                }
            } else {
                alert("LỖI: Không tải được thư viện Supabase. Vui lòng kiểm tra mạng!");
            }
        });

        // --- 4. HÀM ĐĂNG NHẬP ---
        window.handleLogin = async function() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const btn = document.getElementById('login-btn');

            if (!user || !pass) { window.showToast("Vui lòng nhập đủ thông tin!", "error"); return; }

            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Đang xác thực...</span>`;
            btn.disabled = true;

            try {
                const { data, error } = await window.db.from('admin_users').select('*').eq('username', user).eq('password', pass).single();

                if (error || !data) {
                    window.showToast("Sai tài khoản hoặc mật khẩu!", "error");
                    btn.innerHTML = originalBtnHtml; btn.disabled = false;
                } else {
                    window.showToast("Đăng nhập thành công!", "success");
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    window.fetchPlayers();
                }
            } catch (err) {
                window.showToast("Lỗi hệ thống kết nối!", "error");
                btn.innerHTML = originalBtnHtml; btn.disabled = false;
            }
        };

        // --- 5. HÀM ĐĂNG XUẤT ---
        window.logout = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            window.showToast("Đã đăng xuất an toàn");
        };

        // --- 6. HÀM TẢI DỮ LIỆU ---
        window.fetchPlayers = async function() {
    const tbody = document.getElementById('player-table-body');
    tbody.innerHTML = `<tr><td colspan="5" class="p-16 text-center"><svg class="w-8 h-8 animate-spin text-emerald-500 mx-auto mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-emerald-400 font-medium tracking-widest uppercase text-xs">Đang đồng bộ Data...</span></td></tr>`;
    
    try {
        const { data, error } = await window.db.from('profiles').select('*').order('gold', { ascending: false });
        
        if (error) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500 bg-red-500/10">Lỗi: ${error.message}</td></tr>`; return; }
        if (!data || data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Chưa có dữ liệu người chơi.</td></tr>`; return; }
        
        tbody.innerHTML = '';
        data.forEach((player, index) => {
            const delay = index * 0.05;
            
            // --- XỬ LÝ DỮ LIỆU AN TOÀN TRÁNH BỊ NULL/UNDEFINED ---
            const charName = player.current_character || 'Char_Adam';
            const userName = player.username || 'Unknown';
            const firstLetter = userName.charAt(0).toUpperCase();
            const gold = (player.gold != null) ? player.gold : 0; 
            const rankPoints = (player.rank_points != null) ? player.rank_points : 0;
            // -----------------------------------------------------

            tbody.innerHTML += `
                <tr class="hover:bg-gray-800/60 transition-colors animate-row" style="animation-delay: ${delay}s">
                    <td class="p-5 font-bold text-white flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-sm shadow-inner text-emerald-400">
                            ${firstLetter}
                        </div>
                        ${userName}
                    </td>
                    <td class="p-5">
                        <span class="inline-flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 px-3 py-1.5 rounded-lg font-bold text-sm">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM9 5h2v2H9V5zm0 4h2v6H9V9z"></path></svg>
                            ${gold.toLocaleString('vi-VN')}
                        </span>
                    </td>
                    <td class="p-5">
                        <span class="inline-flex items-center gap-1.5 bg-blue-500/10 border border-blue-500/20 text-blue-400 px-3 py-1.5 rounded-lg font-bold text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                            ${rankPoints.toLocaleString('vi-VN')}
                        </span>
                    </td>
                    <td class="p-5">
                        <span class="bg-gray-900/80 text-gray-300 border border-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium">${charName}</span>
                    </td>
                    <td class="p-5 text-center">
                        <div class="flex justify-center gap-2">
                            <button onclick="window.openEditModal('${player.id}', '${userName}', ${gold}, ${rankPoints})" class="bg-gray-800 hover:bg-emerald-600 text-gray-300 hover:text-white border border-gray-700 hover:border-emerald-500 px-3 py-1.5 rounded-lg transition-all active:scale-95 flex items-center gap-1.5" title="Sửa">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                <span class="text-sm">Sửa</span>
                            </button>
                            <button onclick="window.viewHistory('${player.id}', '${userName}')" class="bg-gray-800 hover:bg-cyan-600 text-gray-300 hover:text-white border border-gray-700 hover:border-cyan-500 px-3 py-1.5 rounded-lg transition-all active:scale-95 flex items-center gap-1.5" title="Lịch sử">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <span class="text-sm">LS</span>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
    } catch (err) { 
        console.error("Chi tiết lỗi JS:", err); // In lỗi thực tế ra F12
        window.showToast("Lỗi xử lý dữ liệu! Mở F12 để xem chi tiết.", "error"); 
    }
};

        // --- 7. CÁC HÀM MODAL CHỈNH SỬA ---
        window.openEditModal = function(id, username, gold, rank) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-username').value = username;
            document.getElementById('edit-gold').value = gold;
            document.getElementById('edit-rank').value = rank;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        };

        window.savePlayer = async function() {
            const id = document.getElementById('edit-id').value;
            const username = document.getElementById('edit-username').value;
            const gold = document.getElementById('edit-gold').value;
            const rank = document.getElementById('edit-rank').value;

            const { error } = await window.db.from('profiles')
                .update({ username: username, gold: parseInt(gold), rank_points: parseInt(rank) })
                .eq('id', id);

            if (error) {
                window.showToast("Lỗi khi lưu: " + error.message, "error");
            } else {
                window.showToast(`Cập nhật thành công cho ${username}!`);
                window.closeModal('edit-modal');
                window.fetchPlayers();
            }
        };

        // --- 8. HÀM XEM LỊCH SỬ ---
        window.viewHistory = async function(userId, username) {
            document.getElementById('history-title').innerHTML = `
                <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Lịch sử: <span class="text-white ml-1">${username}</span>
            `;
            document.getElementById('history-modal').classList.remove('hidden');
            
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-cyan-400"><svg class="w-8 h-8 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></td></tr>';

            const { data, error } = await window.db.from('match_history')
                .select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(20);

            if (error) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">Lỗi lấy dữ liệu</td></tr>`; return; }
            if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-gray-500 italic">Trống. Chưa có dữ liệu trận đấu.</td></tr>'; return; }

            tbody.innerHTML = '';
            data.forEach((match, index) => {
                let isWin = match.result === 'Win';
                let isLoss = match.result === 'Loss';
                
                let resultBadge = isWin ? '<span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-3 py-1 rounded-full text-xs font-bold w-24 inline-block text-center shadow-inner">WIN</span>' 
                                : isLoss ? '<span class="bg-red-500/10 border border-red-500/30 text-red-400 px-3 py-1 rounded-full text-xs font-bold w-24 inline-block text-center shadow-inner">LOSS</span>'
                                : '<span class="bg-gray-500/10 border border-gray-500/30 text-gray-400 px-3 py-1 rounded-full text-xs font-bold w-24 inline-block text-center shadow-inner">QUIT</span>';
                
                let time = new Date(match.created_at).toLocaleString('vi-VN');
                let mins = Math.floor(match.play_time_seconds / 60);
                let secs = Math.floor(match.play_time_seconds % 60);

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/50 transition-colors animate-row" style="animation-delay: ${index * 0.05}s">
                        <td class="p-4 pl-6">${resultBadge}</td>
                        <td class="p-4"><span class="font-bold text-white">${match.kills}</span> <span class="text-gray-600 font-normal mx-1">/</span> <span class="text-gray-400">${match.deaths}</span></td>
                        <td class="p-4 text-gray-300 font-medium">${mins}m ${secs}s</td>
                        <td class="p-4 pr-6 text-xs text-gray-500 text-right font-mono">${time}</td>
                    </tr>
                `;
            });
        };
    </script>
</body>
</html>
