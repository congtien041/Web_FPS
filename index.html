<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFPS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #0f172a, #020617); 
            min-height: 100vh; 
        }
        
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #06b6d4; } 

        /* Hiệu ứng Glassmorphism */
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* --- HIỆU ỨNG ÁNH SÁNG ĐƯỜNG VIỀN --- */
        @keyframes borderPulse {
            0%, 100% {
                border-color: rgba(16, 185, 129, 0.7); /* Xanh emerald */
                box-shadow: 0 0 10px rgba(16, 185, 129, 0.3), inset 0 0 5px rgba(16, 185, 129, 0.2);
            }
            50% {
                border-color: rgba(34, 197, 94, 0.9); /* Xanh lá sáng hơn */
                box-shadow: 0 0 20px rgba(34, 197, 94, 0.5), inset 0 0 10px rgba(34, 197, 94, 0.3);
            }
        }
        .animated-border {
            animation: borderPulse 3s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        /* Hiệu ứng tương tự cho các đường viền xanh dương của lịch sử */
        @keyframes borderPulseCyan {
            0%, 100% {
                border-color: rgba(6, 182, 212, 0.7);
                box-shadow: 0 0 10px rgba(6, 182, 212, 0.3), inset 0 0 5px rgba(6, 182, 212, 0.2);
            }
            50% {
                border-color: rgba(34, 211, 238, 0.9);
                box-shadow: 0 0 20px rgba(34, 211, 238, 0.5), inset 0 0 10px rgba(34, 211, 238, 0.3);
            }
        }
        .animated-border-cyan {
            animation: borderPulseCyan 3s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        /* --- HIỆU ỨNG CHỮ PHÁT SÁNG CHO TÊN --- */
        @keyframes nameGlowPulse {
            0%, 100% {
                text-shadow: 0 0 5px rgba(16, 185, 129, 0.5), 0 0 10px rgba(16, 185, 129, 0.3);
            }
            50% {
                text-shadow: 0 0 15px rgba(16, 185, 129, 0.8), 0 0 25px rgba(16, 185, 129, 0.6);
            }
        }
        .owner-name {
            animation: nameGlowPulse 4s infinite ease-in-out;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="text-gray-100 antialiased selection:bg-emerald-500 selection:text-white p-4 md:p-8">

    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3"></div>

    <div id="login-section" class="flex min-h-screen items-center justify-center p-4">
        <div class="glass-panel p-8 md:p-10 rounded-2xl shadow-2xl w-full max-w-md relative overflow-hidden animated-border border-t-4 border-emerald-500">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500 rounded-full blur-3xl opacity-20"></div>
            
            <div class="text-center mb-10 relative">
                <div class="inline-block p-3 rounded-xl bg-gray-800 border border-gray-700 mb-3 shadow-lg">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-1">SimpleFPS</h1>
                <p class="text-gray-400 text-sm font-semibold uppercase tracking-widest">Admin Gateway</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Tài khoản Admin</label>
                    <input type="text" id="admin-user" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Mật khẩu</label>
                    <input type="password" id="admin-pass" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
                </div>

                <div id="login-error" class="hidden p-3 bg-red-500/10 border border-red-500 text-red-400 text-sm rounded-lg text-center"></div>

                <button type="button" onclick="window.handleLogin()" id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-emerald-500/50 transition transform active:scale-95 flex justify-center items-center gap-2">
                    <span>Đăng Nhập Khóa</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-4 md:p-0">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center shadow-lg animated-border border-l-4 border-emerald-500">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-inner">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-emerald-400">Hệ Thống Quản Trị</h1>
                    <p class="text-gray-400 text-sm mt-0.5">SimpleFPS Player Database</p>
                    <p class="text-xs text-emerald-500/80 mt-1 font-mono tracking-wider flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        Admin: <span class="text-emerald-400 owner-name">TranCongTien_041</span>
                    </p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="window.fetchPlayers()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2.5 rounded-lg border border-gray-600 shadow-inner transition active:scale-95 flex items-center gap-2 group">
                    <svg class="w-4 h-4 text-gray-400 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Làm mới
                </button>
                <button onclick="window.logout()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-lg shadow transition active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Thoát
                </button>
            </div>
        </header>

        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden animated-border border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-gray-300 text-xs uppercase tracking-wider">
                            <th class="p-5 font-semibold">Tài khoản</th>
                            <th class="p-5 font-semibold">Vàng</th>
                            <th class="p-5 font-semibold">Rank Points</th>
                            <th class="p-5 font-semibold">Nhân vật</th>
                            <th class="p-5 font-semibold text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="divide-y divide-gray-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-md p-8 animated-border border border-emerald-500">
            <h2 class="text-2xl font-bold text-emerald-400 mb-6 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Chỉnh sửa người chơi
            </h2>
            <input type="hidden" id="edit-id">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                    <input type="text" id="edit-username" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Vàng (Gold)</label>
                    <input type="number" id="edit-gold" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-yellow-400 font-bold focus:border-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Điểm Rank</label>
                    <input type="number" id="edit-rank" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-blue-400 font-bold focus:border-emerald-500 outline-none">
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-800">
                <button onclick="window.closeModal('edit-modal')" class="hover:bg-gray-700 text-gray-300 px-5 py-2.5 rounded-lg transition">Hủy</button>
                <button onclick="window.savePlayer()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-lg font-bold text-white shadow-lg transition transform active:scale-95 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Lưu
                </button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-3xl p-0 border flex flex-col max-h-[85vh] animated-border-cyan border-cyan-500 overflow-hidden">
            
            <div class="bg-gray-800 p-6 flex justify-between items-center border-b border-gray-700">
                <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2" id="history-title">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    Lịch sử đấu
                </h2>
                <button onclick="window.closeModal('history-modal')" class="text-gray-400 hover:text-white bg-gray-700 hover:bg-gray-600 rounded-full w-8 h-8 flex items-center justify-center transition">&times;</button>
            </div>
            
            <div class="overflow-y-auto flex-1 p-2 custom-scrollbar bg-gray-900/50">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-400 text-xs uppercase tracking-wider rounded-lg sticky top-0 bg-gray-900 z-10">
                            <th class="p-4 rounded-l-lg">Kết quả</th>
                            <th class="p-4">Kills / Deaths</th>
                            <th class="p-4">Thời gian chơi</th>
                            <th class="p-4 rounded-r-lg">Ngày giờ</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="divide-y divide-gray-800/80 mt-2"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH SUPABASE
        window.dbURL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        // TIẾN NHỚ ĐỔI ĐOẠN KEY DƯỚI ĐÂY THÀNH KEY CHUẨN CỦA BẠN (bắt đầu bằng eyJ...)
        window.dbKey = 'DÁN_MÃ_API_KEY_CỦA_BẠN_VÀO_ĐÂY'; 
        
        let supabase;

        // --- HÀM TOAST THÔNG BÁO --- giới thiệu một span owner-name mới-->
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colorClass = type === 'success' ? 'bg-emerald-600' : 
                               type === 'error'   ? 'bg-red-600' : 'bg-blue-600';

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-lg shadow-xl ${colorClass} text-white font-medium animate-row`;
            toast.innerHTML = `
                ${type === 'success' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                ${type === 'error' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>' : ''}
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Tự động xóa sau 3 giây
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        if (window.supabase) {
            window.db = window.supabase.createClient(window.dbURL, window.dbKey);
            checkLoginState();
        } else {
            alert("LỖI: Không tải được thư viện Supabase. Vui lòng kiểm tra mạng!");
        }

        function checkLoginState() {
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                showDashboard();
            }
        }

        // --- ĐĂNG NHẬP / ĐĂNG XUẤT ---
        window.handleLogin = async function() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!user || !pass) {
                showToast("Vui lòng nhập đủ tài khoản và mật khẩu!", "error"); return;
            }

            errorMsg.classList.add('hidden');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = `
                <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span>Đang kiểm tra...</span>
            `;
            btn.disabled = true;

            try {
                const { data, error } = await window.db.from('admin_users').select('*').eq('username', user).eq('password', pass).single();

                if (error || !data) {
                    showToast("Sai tài khoản hoặc mật khẩu!", "error");
                    btn.innerHTML = originalBtnText; btn.disabled = false;
                } else {
                    showToast("Đăng nhập thành công!", "success");
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    showDashboard();
                }
            } catch (err) {
                showToast("Lỗi hệ thống: " + err.message, "error");
                btn.innerHTML = originalBtnText; btn.disabled = false;
            }
        };

        window.logout = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            showToast("Đã đăng xuất");
        };

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            window.fetchPlayers();
        }

        // --- TẢI DỮ LIỆU NGƯỜI CHƠI ---
        window.fetchPlayers = async function() {
            const tbody = document.getElementById('player-table-body');
            tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-emerald-400 font-medium">⏳ Đang đồng bộ dữ liệu...</td></tr>';
            try {
                const { data, error } = await window.db.from('profiles').select('*').order('gold', { ascending: false });
                
                if (error) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Lỗi: ${error.message}</td></tr>`; return; }
                if (!data || data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Chưa có người chơi nào.</td></tr>`; return; }
                
                tbody.innerHTML = '';
                data.forEach(player => {
                    const charName = player.current_character || 'Char_Adam';
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/60 transition duration-150 group">
                            <td class="p-5 font-bold text-white flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xs font-mono shadow-inner group-hover:border-emerald-500/50 transition">
                                    ${player.username.charAt(0).toUpperCase()}
                                </div>
                                ${player.username}
                            </td>
                            <td class="p-5"><span class="bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 px-3 py-1.5 rounded-lg font-bold text-sm flex items-center gap-1.5">🪙 ${player.gold.toLocaleString('vi-VN')}</span></td>
                            <td class="p-5"><span class="bg-blue-500/10 border border-blue-500/20 text-blue-400 px-3 py-1.5 rounded-lg font-bold text-sm flex items-center gap-1.5">🏆 ${player.rank_points.toLocaleString('vi-VN')}</span></td>
                            <td class="p-5 text-gray-400 text-sm font-medium bg-gray-900/40 rounded-lg p-3 inline-block">${charName}</td>
                            <td class="p-5 text-center">
                                <button onclick="window.openEditModal('${player.id}', '${player.username}', ${player.gold}, ${player.rank_points})" class="bg-emerald-600/10 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/30 hover:border-emerald-500 px-3 py-1.5 rounded-lg transition text-sm mr-2 active:scale-95 flex items-center gap-1 inline-flex">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    Sửa
                                </button>
                                <button onclick="window.viewHistory('${player.id}', '${player.username}')" class="bg-cyan-600/10 hover:bg-cyan-600 text-cyan-400 hover:text-white border border-cyan-500/30 hover:border-cyan-500 px-3 py-1.5 rounded-lg transition text-sm active:scale-95 flex items-center gap-1 inline-flex">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                    Lịch sử
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Lỗi web: ${err.message}</td></tr>`; }
        };

        // --- CÁC HÀM MODAL (SỬA & LỊCH SỬ) ---
        window.openEditModal = function(id, username, gold, rank) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-username').value = username;
            document.getElementById('edit-gold').value = gold;
            document.getElementById('edit-rank').value = rank;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        };

        window.savePlayer = async function() {
            const id = document.getElementById('edit-id').value;
            const username = document.getElementById('edit-username').value;
            const gold = document.getElementById('edit-gold').value;
            const rank = document.getElementById('edit-rank').value;

            const { error } = await window.db.from('profiles')
                .update({ username: username, gold: parseInt(gold), rank_points: parseInt(rank) })
                .eq('id', id);

            if (error) {
                showToast('❌ Lỗi cập nhật: ' + error.message, "error");
            } else {
                showToast(`Đã lưu thay đổi cho ${username}!`);
                window.closeModal('edit-modal');
                window.fetchPlayers();
            }
        };

        window.viewHistory = async function(userId, username) {
            document.getElementById('history-title').innerHTML = `
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span>📊 Lịch sử đấu: <span class="text-white">${username}</span></span>
            `;
            document.getElementById('history-modal').classList.remove('hidden');
            
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-cyan-400 animate-pulse">Đang tìm dữ liệu...</td></tr>';

            const { data, error } = await window.db.from('match_history')
                .select('*')
                .eq('user_id', userId)
                .order('created_at', { ascending: false })
                .limit(20);

            if (error) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">Lỗi: ${error.message}</td></tr>`; return; }
            if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500 italic">Người chơi chưa có dữ liệu trận đấu.</td></tr>'; return; }

            tbody.innerHTML = '';
            data.forEach(match => {
                const isWin = match.result === 'Win';
                const isLoss = match.result === 'Loss';
                
                let resultBadge;
                if (isWin) {
                    resultBadge = '<span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full font-bold text-xs flex items-center gap-1 w-max">✅ VICTORY</span>';
                } else if (isLoss) {
                    resultBadge = '<span class="bg-red-500/10 border border-red-500/20 text-red-400 px-3 py-1.5 rounded-full font-bold text-xs flex items-center gap-1 w-max">❌ DEFEAT</span>';
                } else {
                    resultBadge = '<span class="bg-gray-500/10 border border-gray-500/20 text-gray-400 px-3 py-1.5 rounded-full font-bold text-xs flex items-center gap-1 w-max">⚠️ QUIT</span>';
                }
                
                const time = new Date(match.created_at).toLocaleString('vi-VN');
                const mins = Math.floor(match.play_time_seconds / 60);
                const secs = Math.floor(match.play_time_seconds % 60);

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/60 transition duration-100">
                        <td class="p-4">${resultBadge}</td>
                        <td class="p-4 font-bold text-white">${match.kills} K <span class="text-gray-500">/</span> <span class="text-gray-400">${match.deaths} D</span></td>
                        <td class="p-4 text-gray-300 font-medium">${mins}p ${secs}s</td>
                        <td class="p-4 text-xs text-gray-500 font-mono tracking-tighter">${time}</td>
                    </tr>
                `;
            });
        };
    </script>
</body>
</html>
