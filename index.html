<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFPS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #059669; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-gray-100 antialiased selection:bg-emerald-500 selection:text-white">

    <div id="login-section" class="flex min-h-screen items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-emerald-500 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500 rounded-full blur-3xl opacity-20"></div>
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">
                    SimpleFPS
                </h1>
                <p class="text-gray-400 text-sm tracking-widest uppercase font-semibold">Admin Gateway</p>
            </div>

            <div id="login-form">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Tài khoản Admin</label>
                    <input type="text" id="admin-user" required autocomplete="off"
                        class="w-full bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Mật khẩu</label>
                    <input type="password" id="admin-pass" required
                        class="w-full bg-gray-900/50 border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none transition">
                </div>

                <div id="login-error" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500 text-red-400 text-sm rounded-lg text-center">
                    Sai tài khoản hoặc mật khẩu!
                </div>

                <button type="button" id="login-btn" onclick="handleLogin()"
                    class="w-full bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-emerald-500/30 transition-all duration-200 transform hover:-translate-y-0.5">
                    Đăng Nhập
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-6">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center shadow-lg border-l-4 border-emerald-500">
            <div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">Dashboard</h1>
                <p class="text-gray-400 text-sm mt-1">Quản lý người chơi game SimpleFPS</p>
            </div>
            
            <div class="mt-4 md:mt-0 flex gap-4">
                <button onclick="fetchPlayers()" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2">
                    Làm mới
                </button>
                <button onclick="logout()" class="bg-red-600/80 hover:bg-red-500 text-white px-5 py-2.5 rounded-lg shadow transition">
                    Đăng Xuất
                </button>
            </div>
        </header>

        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800/80 text-gray-300 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="p-5 font-semibold">Username</th>
                            <th class="p-5 font-semibold">Tài Sản</th>
                            <th class="p-5 font-semibold">Rank Points</th>
                            <th class="p-5 font-semibold">Nhân vật</th>
                            <th class="p-5 font-semibold text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="divide-y divide-gray-700/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-md p-8 border border-emerald-500/50">
            <h2 class="text-2xl font-bold text-white mb-6">⚙️ Chỉnh sửa người chơi</h2>
            <input type="hidden" id="edit-id">
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
                    <input type="text" id="edit-username" class="w-full bg-gray-900/80 border border-gray-600 rounded-lg p-3 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Vàng</label>
                    <input type="number" id="edit-gold" class="w-full bg-gray-900/80 border border-gray-600 rounded-lg p-3 text-yellow-400 font-bold outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Điểm Rank</label>
                    <input type="number" id="edit-rank" class="w-full bg-gray-900/80 border border-gray-600 rounded-lg p-3 text-blue-400 font-bold outline-none">
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-8">
                <button onclick="closeModal('edit-modal')" class="hover:bg-gray-700 text-gray-300 px-5 py-2.5 rounded-lg transition">Hủy</button>
                <button onclick="savePlayer()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-lg font-bold text-white shadow-lg transition">Lưu</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-3xl p-6 border border-cyan-500/50 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-700">
                <h2 class="text-xl font-bold text-cyan-400" id="history-title">📊 Lịch sử đấu</h2>
                <button onclick="closeModal('history-modal')" class="text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 rounded-full w-8 h-8 flex items-center justify-center">&times;</button>
            </div>
            
            <div class="overflow-y-auto flex-1 pr-2">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800/50 text-gray-400 text-xs uppercase tracking-wider rounded-lg">
                            <th class="p-4">Kết quả</th>
                            <th class="p-4">K/D</th>
                            <th class="p-4">Thời gian</th>
                            <th class="p-4">Ngày giờ</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="divide-y divide-gray-800/50 mt-2"></tbody>
                </table>
            </div>
        </div>
    </div>

    </html>
</body>
</html>
