<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - SimpleFPS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #00ff88; font-size: 24px; }
        p { font-size: 14px; color: #aaaaaa; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #1a1a1a;
            color: white;
            outline: none;
        }
        input:focus { border-color: #00ff88; }
        button {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            transition: 0.2s;
        }
        button:hover { background-color: #00cc6a; }
        #message { margin-top: 20px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container" id="reset-container">
        <h2>Tạo Mật Khẩu Mới</h2>
        <p>Hệ thống bảo mật SimpleFPS</p>
        
        <input type="password" id="new-password" placeholder="Mật khẩu mới (ít nhất 6 ký tự)">
        <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới">
        
        <button id="submit-btn" onclick="updatePassword()">Xác Nhận Đổi</button>
        <div id="message"></div>
    </div>

    <script>
        // URL và Key được lấy tự động từ SupabaseManager.cs của bạn
        const SUPABASE_URL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB';

        // Khởi tạo kết nối Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Kiểm tra xem người dùng có vào trang web thông qua Link trong Email không
        window.onload = () => {
            const hash = window.location.hash;
            if (!hash || !hash.includes('type=recovery')) {
                document.getElementById('reset-container').innerHTML = "<h3>Lỗi bảo mật!</h3><p>Đường dẫn không hợp lệ hoặc đã hết hạn.<br>Vui lòng vào lại game và yêu cầu gửi email mới.</p>";
            }
        };

        async function updatePassword() {
            const pass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const msg = document.getElementById('message');

            if (pass.length < 6) {
                msg.style.color = '#ff4d4d'; // Màu đỏ
                msg.innerText = "Mật khẩu phải có ít nhất 6 ký tự!";
                return;
            }

            if (pass !== confirmPass) {
                msg.style.color = '#ff4d4d'; // Màu đỏ
                msg.innerText = "Hai mật khẩu không khớp nhau!";
                return;
            }

            msg.style.color = '#00ff88'; // Màu xanh lá
            msg.innerText = "Đang kết nối tới máy chủ...";

            // Bắn lệnh lên Supabase để đổi Pass
            const { data, error } = await supabase.auth.updateUser({ password: pass });

            if (error) {
                msg.style.color = '#ff4d4d';
                msg.innerText = "Lỗi: " + error.message;
            } else {
                msg.style.color = '#00ff88';
                msg.innerText = "✅ ĐỔI MẬT KHẨU THÀNH CÔNG! Bạn có thể tắt trang web này và quay lại Game để đăng nhập.";
                
                // Giấu ô nhập liệu đi cho đẹp
                document.getElementById('new-password').style.display = 'none';
                document.getElementById('confirm-password').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'none';
            }
        }
    </script>
</body>
</html>
