<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục mật khẩu - SimpleFPS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .container {
            background-color: #2d2d2d; padding: 40px 30px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); width: 320px; text-align: center;
        }
        h2 { margin-top: 0; color: #00ff88; font-size: 24px; }
        p { font-size: 14px; color: #aaaaaa; margin-bottom: 20px; }
        input {
            width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #444;
            border-radius: 6px; background-color: #1a1a1a; color: white; outline: none;
        }
        input:focus { border-color: #00ff88; }
        button {
            background-color: #00ff88; color: #000; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold;
            font-size: 16px; margin-top: 15px; transition: 0.2s;
        }
        button:hover { background-color: #00cc6a; }
        #message { margin-top: 20px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container" id="reset-container">
        <h2>Tạo Mật Khẩu Mới</h2>
        <p>Hệ thống bảo mật SimpleFPS</p>
        
        <input type="password" id="new-password" placeholder="Mật khẩu mới (ít nhất 6 ký tự)">
        <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới">
        
        <button id="submit-btn" onclick="updatePassword()">Xác Nhận Đổi</button>
        <div id="message"></div>
    </div>

    <script>
        try {
            // URL và Key được lấy tự động từ SupabaseManager.cs của bạn
            const SUPABASE_URL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB';

            // Khởi tạo kết nối Supabase
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // Kiểm tra link có hợp lệ không (Hỗ trợ cả Hash và Query PKCE)
            window.onload = () => {
                const url = window.location.href;
                if (!url.includes('type=recovery') && !url.includes('code=')) {
                    document.getElementById('message').style.color = '#ff4d4d';
                    document.getElementById('message').innerText = "Cảnh báo: Không tìm thấy phiên khôi phục hợp lệ. Hãy thử mở lại link từ Email.";
                }
            };

            // Hàm được gọi khi bấm nút
            async function updatePassword() {
                const pass = document.getElementById('new-password').value;
                const confirmPass = document.getElementById('confirm-password').value;
                const msg = document.getElementById('message');

                if (pass.length < 6) {
                    msg.style.color = '#ff4d4d'; 
                    msg.innerText = "Mật khẩu phải có ít nhất 6 ký tự!";
                    return;
                }

                if (pass !== confirmPass) {
                    msg.style.color = '#ff4d4d'; 
                    msg.innerText = "Hai mật khẩu không khớp nhau!";
                    return;
                }

                msg.style.color = '#00ff88'; 
                msg.innerText = "Đang kết nối tới máy chủ, vui lòng đợi...";

                // Bắn lệnh lên Supabase để đổi Pass
                const { data, error } = await supabase.auth.updateUser({ password: pass });

                if (error) {
                    msg.style.color = '#ff4d4d';
                    msg.innerText = "Lỗi từ Server: " + error.message;
                    console.error("Supabase Error:", error);
                } else {
                    msg.style.color = '#00ff88';
                    msg.innerText = "✅ ĐỔI MẬT KHẨU THÀNH CÔNG! Hãy quay lại Game để đăng nhập.";
                    
                    document.getElementById('new-password').style.display = 'none';
                    document.getElementById('confirm-password').style.display = 'none';
                    document.getElementById('submit-btn').style.display = 'none';
                }
            }
        } catch (err) {
            document.getElementById('message').style.color = '#ff4d4d';
            document.getElementById('message').innerText = "Lỗi hệ thống Web: " + err.message;
        }
    </script>
</body>
</html>
