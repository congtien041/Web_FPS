<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFPS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #0f172a, #020617); 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #06b6d4; } 

        /* Hiệu ứng Glassmorphism */
        .glass-panel { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- CÁC HIỆU ỨNG ANIMATION --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-row {
            opacity: 0;
            animation: fadeInUp 0.4s ease-out forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-toast { animation: slideInRight 0.3s ease-out forwards; }

        /* Vòng sáng background */
        .bg-glow {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; z-index: -1; pointer-events: none;
        }
    </style>
</head>
<body class="text-gray-100 antialiased selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <div id="login-section" class="flex min-h-screen items-center justify-center p-4 relative">
        <div class="bg-glow top-0 left-0"></div>
        <div class="bg-glow bottom-0 right-0" style="background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(0,0,0,0) 70%);"></div>
        
        <div class="glass-panel p-10 rounded-2xl w-full max-w-md border-t-4 border-emerald-500 relative z-10 animate-pop">
            <div class="text-center mb-10 relative">
                <div class="inline-block p-3 rounded-full bg-gray-800/50 border border-gray-700 mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-1">SimpleFPS</h1>
                <p class="text-gray-400 text-xs font-bold uppercase tracking-[0.2em]">Admin Gateway</p>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm text-gray-400 mb-2 font-medium">Tài khoản Admin</label>
                    <input type="text" id="admin-user" class="w-full bg-gray-900/80 border border-gray-700 rounded-xl p-3.5 text-white outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-inner">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2 font-medium">Mật khẩu</label>
                    <input type="password" id="admin-pass" class="w-full bg-gray-900/80 border border-gray-700 rounded-xl p-3.5 text-white outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-inner">
                </div>

                <div id="login-error" class="hidden p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg text-center animate-pop"></div>

                <button type="button" onclick="window.handleLogin()" id="login-btn" class="w-full mt-2 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.3)] hover:shadow-[0_0_25px_rgba(16,185,129,0.5)] transition-all duration-300 transform active:scale-95 flex justify-center items-center gap-2">
                    <span>Đăng Nhập Khóa</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-4 md:p-8 animate-pop">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center border-l-4 border-emerald-500">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="bg-gradient-to-tr from-emerald-500 to-cyan-500 p-3 rounded-xl shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Quản Trị Hệ Thống</h1>
                    <p class="text-gray-400 text-sm mt-0.5">SimpleFPS Player Database</p>
                </div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="window.fetchPlayers()" class="bg-gray-800/80 hover:bg-gray-700 text-white px-4 py-2.5 rounded-xl border border-gray-600/50 shadow-lg transition-all active:scale-95 flex items-center gap-2 group">
                    <svg class="w-4 h-4 text-gray-400 group-hover:text-white group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Làm mới
                </button>
                <button onclick="window.logout()" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-4 py-2.5 rounded-xl border border-red-500/20 hover:border-red-500 shadow-lg transition-all active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Thoát
                </button>
            </div>
        </header>

        <div class="glass-panel rounded-2xl overflow-hidden border border-gray-700/50">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/60 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="p-5 font-semibold">Tài khoản</th>
                            <th class="p-5 font-semibold">Kinh tế</th>
                            <th class="p-5 font-semibold">Xếp hạng</th>
                            <th class="p-5 font-semibold">Nhân vật</th>
                            <th class="p-5 font-semibold text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="divide-y divide-gray-800/50 relative"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="glass-panel rounded-2xl shadow-[0_0_40px_rgba(16,185,129,0.2)] w-full max-w-md p-8 border border-emerald-500/50 animate-pop">
            <div class="flex items-center gap-3 mb-6">
                <div class="p-2 bg-emerald-500/20 rounded-lg border border-emerald-500/30">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-white">Chỉnh sửa Dữ liệu</h2>
            </div>

            <input type="hidden" id="edit-id">
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold tracking-wide">Tên hiển thị</label>
                    <input type="text" id="edit-username" class="w-full bg-gray-900/50 border border-gray-700 rounded-xl p-3 text-white focus:border-emerald-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold tracking-wide">Tài sản (Vàng)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-yellow-500 font-bold">V</span>
                        <input type="number" id="edit-gold" class="w-full bg-gray-900/50 border border-gray-700 rounded-xl p-3 pl-8 text-yellow-400 font-bold focus:border-emerald-500 outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 uppercase font-bold tracking-wide">Điểm Xếp Hạng</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-blue-500 font-bold">RP</span>
                        <input type="number" id="edit-rank" class="w-full bg-gray-900/50 border border-gray-700 rounded-xl p-3 pl-10 text-blue-400 font-bold focus:border-emerald-500 outline-none transition">
                    </div>
                </div>
            </div>
            
            <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-800">
                <button onclick="window.closeModal('edit-modal')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-5 py-2.5 rounded-xl transition-all active:scale-95 font-medium">Đóng</button>
                <button onclick="window.savePlayer()" class="bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 px-6 py-2.5 rounded-xl font-bold text-white shadow-lg shadow-emerald-500/20 transition-all active:scale-95">Xác nhận Lưu</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass-panel rounded-2xl shadow-[0_0_40px_rgba(6,182,212,0.2)] w-full max-w-3xl p-0 border border-cyan-500/50 flex flex-col max-h-[85vh] animate-pop overflow-hidden">
            
            <div class="bg-gray-900/50 p-6 flex justify-between items-center border-b border-gray-800">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-cyan-500/20 rounded-lg border border-cyan-500/30">
                        <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    </div>
                    <h2 class="text-xl font-bold text-white" id="history-title">Lịch sử đấu</h2>
                </div>
                <button onclick="window.closeModal('history-modal')" class="text-gray-400 hover:text-white bg-gray-800 hover:bg-gray-700 rounded-full p-2 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="overflow-y-auto flex-1 p-2 custom-scrollbar bg-gray-900/30">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-500 text-xs uppercase tracking-wider sticky top-0 bg-gray-900/90 backdrop-blur z-10">
                            <th class="p-4 font-semibold">Trạng thái</th>
                            <th class="p-4 font-semibold">Kills / Deaths</th>
                            <th class="p-4 font-semibold">Thời lượng</th>
                            <th class="p-4 font-semibold text-right">Thời gian ghi nhận</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body" class="divide-y divide-gray-800/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        window.dbURL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        window.dbKey = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB'; 
        
        // --- HÀM TOAST THÔNG BÁO XỊN XÒ ---
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Đổi màu tùy loại thông báo
            const colorClass = type === 'success' ? 'bg-emerald-500 border-emerald-400' : 
                               type === 'error'   ? 'bg-red-500 border-red-400' : 'bg-blue-500 border-blue-400';
            const icon = type === 'success' ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' :
                         type === 'error'   ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>' : '';

            toast.className = `flex items-center gap-3 px-5 py-3 rounded-xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] border ${colorClass} text-white font-medium animate-toast pointer-events-auto`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Tự động xóa sau 3 giây
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(50px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        if (window.supabase) {
            window.db = window.supabase.createClient(window.dbURL, window.dbKey);
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                window.fetchPlayers();
            }
        } else {
            showToast("Không tải được thư viện Supabase!", "error");
        }

        window.handleLogin = async function() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const btn = document.getElementById('login-btn');

            if (!user || !pass) { showToast("Vui lòng nhập đủ thông tin!", "error"); return; }

            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = `<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Đang xác thực...`;
            btn.disabled = true;

            try {
                const { data, error } = await window.db.from('admin_users').select('*').eq('username', user).eq('password', pass).single();

                if (error || !data) {
                    showToast("Sai tài khoản hoặc mật khẩu!", "error");
                } else {
                    showToast("Đăng nhập thành công!", "success");
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    window.fetchPlayers();
                }
            } catch (err) {
                showToast("Lỗi hệ thống!", "error");
            } finally {
                btn.innerHTML = originalBtnHtml; btn.disabled = false;
            }
        };

        window.logout = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
            showToast("Đã đăng xuất", "info");
        };

        window.fetchPlayers = async function() {
            const tbody = document.getElementById('player-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="p-16 text-center"><svg class="w-8 h-8 animate-spin text-emerald-500 mx-auto mb-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-emerald-400 font-medium tracking-widest uppercase text-xs">Đang đồng bộ Data...</span></td></tr>`;
            
            try {
                const { data, error } = await window.db.from('profiles').select('*').order('gold', { ascending: false });
                
                if (error) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Lỗi: ${error.message}</td></tr>`; return; }
                if (!data || data.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Chưa có người chơi nào.</td></tr>`; return; }
                
                tbody.innerHTML = '';
                data.forEach((player, index) => {
                    const delay = index * 0.05; // Tạo hiệu ứng bậc thang
                    const charName = player.current_character || 'Char_Adam';
                    
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/60 transition-colors animate-row" style="animation-delay: ${delay}s">
                            <td class="p-4 font-bold text-white flex items-center gap-3">
                                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-sm shadow-[0_0_10px_rgba(16,185,129,0.3)]">
                                    ${player.username.charAt(0).toUpperCase()}
                                </div>
                                ${player.username}
                            </td>
                            <td class="p-4">
                                <span class="inline-flex items-center gap-1.5 bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 px-3 py-1.5 rounded-lg font-bold text-sm shadow-inner">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM9 5h2v2H9V5zm0 4h2v6H9V9z"></path></svg>
                                    ${player.gold.toLocaleString('vi-VN')}
                                </span>
                            </td>
                            <td class="p-4">
                                <span class="inline-flex items-center gap-1.5 bg-blue-500/10 border border-blue-500/20 text-blue-400 px-3 py-1.5 rounded-lg font-bold text-sm shadow-inner">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                    ${player.rank_points.toLocaleString('vi-VN')}
                                </span>
                            </td>
                            <td class="p-4">
                                <span class="bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1.5 rounded-lg text-xs font-medium">${charName}</span>
                            </td>
                            <td class="p-4 text-center">
                                <div class="flex justify-center gap-2">
                                    <button onclick="window.openEditModal('${player.id}', '${player.username}', ${player.gold}, ${player.rank_points})" class="bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-white border border-emerald-500/30 hover:border-emerald-500 px-3 py-2 rounded-lg transition-all active:scale-90 flex items-center gap-1" title="Chỉnh sửa">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    </button>
                                    <button onclick="window.viewHistory('${player.id}', '${player.username}')" class="bg-cyan-500/10 hover:bg-cyan-500 text-cyan-400 hover:text-white border border-cyan-500/30 hover:border-cyan-500 px-3 py-2 rounded-lg transition-all active:scale-90 flex items-center gap-1" title="Xem Lịch sử">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) { showToast("Lỗi tải dữ liệu!", "error"); }
        };

        window.openEditModal = function(id, username, gold, rank) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-username').value = username;
            document.getElementById('edit-gold').value = gold;
            document.getElementById('edit-rank').value = rank;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        };

        window.savePlayer = async function() {
            const id = document.getElementById('edit-id').value;
            const username = document.getElementById('edit-username').value;
            const gold = document.getElementById('edit-gold').value;
            const rank = document.getElementById('edit-rank').value;

            const { error } = await window.db.from('profiles')
                .update({ username: username, gold: parseInt(gold), rank_points: parseInt(rank) })
                .eq('id', id);

            if (error) {
                showToast("Lỗi cập nhật: " + error.message, "error");
            } else {
                showToast(`Đã lưu thay đổi cho ${username}!`, "success");
                window.closeModal('edit-modal');
                window.fetchPlayers();
            }
        };

        window.viewHistory = async function(userId, username) {
            document.getElementById('history-title').innerHTML = `Lịch sử: <span class="text-cyan-400">${username}</span>`;
            document.getElementById('history-modal').classList.remove('hidden');
            
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-12 text-center text-cyan-400"><svg class="w-8 h-8 animate-spin mx-auto" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></td></tr>';

            const { data, error } = await window.db.from('match_history')
                .select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(20);

            if (error) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">Lỗi: ${error.message}</td></tr>`; return; }
            if (data.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500 italic">Người chơi chưa có dữ liệu trận đấu.</td></tr>'; return; }

            tbody.innerHTML = '';
            data.forEach((match, index) => {
                let isWin = match.result === 'Win';
                let isLoss = match.result === 'Loss';
                
                let resultBadge = isWin ? '<span class="bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-emerald-500/30 flex items-center gap-1 w-max"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg> VICTOR</span>' 
                                : isLoss ? '<span class="bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-500/30 flex items-center gap-1 w-max"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg> DEFEAT</span>'
                                : '<span class="bg-gray-500/20 text-gray-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-gray-500/30 flex items-center gap-1 w-max"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> QUIT</span>';
                
                let time = new Date(match.created_at).toLocaleString('vi-VN');
                let mins = Math.floor(match.play_time_seconds / 60);
                let secs = Math.floor(match.play_time_seconds % 60);

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-800/40 transition animate-row" style="animation-delay: ${index * 0.05}s">
                        <td class="p-4">${resultBadge}</td>
                        <td class="p-4 font-bold"><span class="text-white">${match.kills}</span> <span class="text-gray-600 font-normal">/</span> <span class="text-gray-400">${match.deaths}</span></td>
                        <td class="p-4 text-gray-300 font-medium">${mins}m ${secs}s</td>
                        <td class="p-4 text-xs text-gray-500 text-right font-mono tracking-tighter">${time}</td>
                    </tr>
                `;
            });
        };
    </script>
</body>
</html>
