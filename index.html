<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFPS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); min-height: 100vh; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-gray-100 antialiased">

    <div id="login-section" class="flex min-h-screen items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-emerald-500 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500 rounded-full blur-3xl opacity-20"></div>
            <div class="text-center mb-8 relative">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">SimpleFPS</h1>
                <p class="text-gray-400 text-sm font-semibold uppercase tracking-widest">Admin Gateway</p>
            </div>

            <div class="relative">
                <div class="mb-5">
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Tài khoản Admin</label>
                    <input type="text" id="admin-user" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-emerald-500">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2 font-medium">Mật khẩu</label>
                    <input type="password" id="admin-pass" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none focus:border-emerald-500">
                </div>

                <div id="login-error" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500 text-red-400 text-sm rounded-lg text-center"></div>

                <button type="button" onclick="window.handleLogin()" id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg transition transform hover:-translate-y-0.5">
                    Đăng Nhập
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-6">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center shadow-lg border-l-4 border-emerald-500">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">Dashboard</h1>
                <p class="text-gray-400 text-sm mt-1">Quản lý tài khoản SimpleFPS</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-4">
                <button onclick="window.fetchPlayers()" class="bg-gray-800 hover:bg-gray-700 text-white px-5 py-2.5 rounded-lg border border-gray-600">Làm mới</button>
                <button onclick="window.logout()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-lg">Đăng Xuất</button>
            </div>
        </header>

        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-gray-300 text-xs uppercase tracking-wider">
                        <th class="p-5">Username</th><th class="p-5">Tài Sản</th><th class="p-5">Rank Points</th><th class="p-5 text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="player-table-body" class="divide-y divide-gray-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. Dùng window.db thay vì let để tránh lỗi "already declared" khi dán trùng code
        window.dbURL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        
        window.dbKey = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB'; 
        
        // 2. Khởi tạo Supabase an toàn
        if (window.supabase) {
            window.db = window.supabase.createClient(window.dbURL, window.dbKey);
            
            // Tự động vào bảng điều khiển nếu đã đăng nhập trước đó
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                window.fetchPlayers();
            }
        } else {
            document.getElementById('login-error').innerText = "LỖI MẠNG: Không tải được thư viện Supabase!";
            document.getElementById('login-error').classList.remove('hidden');
        }

        // 3. Hàm Đăng Nhập
        window.handleLogin = async function() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!user || !pass) {
                errorMsg.innerText = "Chưa nhập đủ thông tin kìa Tiến ơi!";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btn.innerText = "Đang kiểm tra...";
            btn.disabled = true;

            try {
                // Gọi vào bảng admin_users
                const { data, error } = await window.db.from('admin_users')
                    .select('*')
                    .eq('username', user)
                    .eq('password', pass)
                    .single();

                if (error) {
                    errorMsg.innerText = "Lỗi Database: " + error.message;
                    errorMsg.classList.remove('hidden');
                } else if (!data) {
                    errorMsg.innerText = "Sai tài khoản hoặc mật khẩu!";
                    errorMsg.classList.remove('hidden');
                } else {
                    // Đăng nhập thành công
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    window.fetchPlayers();
                }
            } catch (err) {
                errorMsg.innerText = "Lỗi máy chủ/mạng: " + err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = "Đăng Nhập";
                btn.disabled = false;
            }
        };

        // 4. Hàm Đăng Xuất
        window.logout = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
        };

        // 5. Hàm Tải Dữ Liệu
        window.fetchPlayers = async function() {
            const tbody = document.getElementById('player-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-emerald-400">Đang tải dữ liệu người chơi...</td></tr>';
            try {
                const { data, error } = await window.db.from('profiles').select('*').order('gold', { ascending: false });
                
                if (error) { 
                    tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">LỖI DATABASE: ${error.message}</td></tr>`; 
                    return; 
                }
                
                if (!data || data.length === 0) { 
                    tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500">Chưa có người chơi nào.</td></tr>`; 
                    return; 
                }
                
                tbody.innerHTML = '';
                data.forEach(player => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800/50 transition">
                            <td class="p-5 font-bold text-white flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center text-xs shadow-lg">
                                    ${player.username.charAt(0).toUpperCase()}
                                </div>
                                ${player.username}
                            </td>
                            <td class="p-5"><span class="bg-yellow-500/10 text-yellow-400 px-3 py-1 rounded-full font-bold text-sm">🪙 ${player.gold}</span></td>
                            <td class="p-5"><span class="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full font-bold text-sm">🏆 ${player.rank_points}</span></td>
                            <td class="p-5 text-center text-gray-400 text-sm">Tính năng sửa đang được ẩn tạm thời</td>
                        </tr>
                    `;
                });
            } catch (err) { 
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">LỖI JAVASCRIPT: ${err.message}</td></tr>`; 
            }
        };
    </script>
</body>
</html>
