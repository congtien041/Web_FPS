<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu Bằng Mã OTP - SimpleFPS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #2d2d2d; padding: 35px 30px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        h2 { color: #00ff88; margin-top: 0; }
        p { font-size: 13px; color: #aaa; margin-bottom: 25px; }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #555; background: #111; color: white; outline: none; }
        input:focus { border-color: #00ff88; }
        button { width: 100%; padding: 12px; background: #00ff88; color: black; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; border-radius: 6px; transition: 0.2s;}
        button:hover { background: #00cc6a; }
        #msg { margin-top: 20px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box" id="main-box">
        <h2>Nhập Mã Xác Nhận</h2>
        <p>Vui lòng kiểm tra Email để lấy mã OTP (6 số).</p>

        <input type="email" id="email" placeholder="Nhập Email của bạn">
        <input type="text" id="otp" placeholder="Mã xác nhận OTP (6 số)">
        <input type="password" id="new-pass" placeholder="Mật khẩu mới (ít nhất 6 ký tự)">
        <input type="password" id="confirm-pass" placeholder="Nhập lại mật khẩu mới">

        <button onclick="changePass()">Đổi Mật Khẩu</button>
        <div id="msg"></div>
    </div>

    <script>
        // Khởi tạo Supabase
        const SUPABASE_URL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function changePass() {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otp').value.trim();
            const pass = document.getElementById('new-pass').value;
            const confirmPass = document.getElementById('confirm-pass').value;
            const msg = document.getElementById('msg');

            // Kiểm tra nhập liệu
            if(!email || !otp) { msg.style.color = '#ff4d4d'; msg.innerText = "Vui lòng nhập Email và Mã OTP!"; return; }
            if(pass.length < 6) { msg.style.color = '#ff4d4d'; msg.innerText = "Mật khẩu phải từ 6 ký tự trở lên!"; return; }
            if(pass !== confirmPass) { msg.style.color = '#ff4d4d'; msg.innerText = "Hai mật khẩu không khớp nhau!"; return; }

            msg.style.color = '#00ff88'; 
            msg.innerText = "Đang xử lý...";

            try {
                // Bước 1: Gửi Email và Mã OTP lên Supabase để xác minh
                const { data, error: verifyError } = await supabase.auth.verifyOtp({
                    email: email,
                    token: otp,
                    type: 'recovery'
                });

                if (verifyError) throw verifyError;

                // Bước 2: Nếu mã OTP đúng, tiến hành cập nhật mật khẩu mới
                const { error: updateError } = await supabase.auth.updateUser({
                    password: pass
                });

                if (updateError) throw updateError;

                // Thành công
                msg.style.color = '#00ff88';
                msg.innerText = "✅ ĐỔI MẬT KHẨU THÀNH CÔNG! Bạn có thể đóng trang này và vào Game đăng nhập.";
                
                // Ẩn các ô nhập để nhìn cho gọn
                document.querySelectorAll('input, button').forEach(el => el.style.display = 'none');

            } catch (err) {
                msg.style.color = '#ff4d4d';
                
                // Dịch một số lỗi tiếng Anh sang tiếng Việt cho dễ hiểu
                if(err.message.includes("Token has expired or is invalid")) {
                    msg.innerText = "Lỗi: Mã OTP sai hoặc đã hết hạn!";
                } else if(err.message.includes("New password should be different")) {
                    msg.innerText = "Lỗi: Mật khẩu mới không được trùng mật khẩu cũ!";
                } else {
                    msg.innerText = "Lỗi: " + err.message;
                }
            }
        }
    </script>
</body>
</html>
