<!DOCTYPE html> 
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFPS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top left, #0f172a, #020617); min-height: 100vh; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-gray-100 antialiased">

    <div id="login-section" class="flex min-h-screen items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-emerald-500">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">SimpleFPS</h1>
                <p class="text-gray-400 text-sm font-semibold">Admin Gateway</p>
            </div>

            <div>
                <div class="mb-5">
                    <label class="block text-sm text-gray-300 mb-2">Tài khoản Admin</label>
                    <input type="text" id="admin-user" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm text-gray-300 mb-2">Mật khẩu</label>
                    <input type="password" id="admin-pass" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white outline-none">
                </div>

                <div id="login-error" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500 text-red-400 text-sm rounded-lg text-center"></div>

                <button type="button" onclick="handleLogin()" id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg transition">
                    Đăng Nhập
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard-section" class="hidden max-w-7xl mx-auto p-6">
        <header class="glass-panel rounded-2xl p-6 mb-8 flex justify-between items-center shadow-lg border-l-4 border-emerald-500">
            <h1 class="text-3xl font-bold text-emerald-400">Dashboard Quản Trị</h1>
            <div class="flex gap-4">
                <button onclick="fetchPlayers()" class="bg-gray-800 hover:bg-gray-700 text-white px-5 py-2 rounded-lg">Làm mới</button>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2 rounded-lg">Đăng Xuất</button>
            </div>
        </header>

        <div class="glass-panel rounded-2xl shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-gray-300 text-xs uppercase">
                        <th class="p-5">Username</th><th class="p-5">Vàng</th><th class="p-5">Rank Points</th><th class="p-5 text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="player-table-body" class="divide-y divide-gray-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        console.log("Đã tải xong file HTML, đang nạp Javascript...");

        const SUPABASE_URL = 'https://ebdytrnnavfvgjkjysqr.supabase.co';
        // TIẾN NHỚ ĐỔI DÒNG DƯỚI THÀNH MÃ CỦA BẠN NHÉ (Bắt đầu bằng eyJ...)
        const SUPABASE_ANON_KEY = 'sb_publishable_0ONS0ziLjfkpkL96Bt-kHg_pBcgw_aB'; 
        
        let supabase;

        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                window.fetchPlayers();
            }
        } else {
            document.getElementById('login-error').innerText = "Không tải được thư viện Supabase (Có thể do mạng hoặc bị chặn).";
            document.getElementById('login-error').classList.remove('hidden');
        }

        // --- Gắn cứng hàm xử lý đăng nhập vào window để chống lỗi Not Defined ---
        window.handleLogin = async function() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!user || !pass) {
                errorMsg.innerText = "Vui lòng nhập đủ tài khoản và mật khẩu!";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btn.innerText = "Đang kiểm tra...";
            btn.disabled = true;

            try {
                const { data, error } = await supabase.from('admin_users').select('*').eq('username', user).eq('password', pass).single();

                if (error) {
                    errorMsg.innerText = "Lỗi Database: " + error.message;
                    errorMsg.classList.remove('hidden');
                } else if (!data) {
                    errorMsg.innerText = "Sai tài khoản hoặc mật khẩu!";
                    errorMsg.classList.remove('hidden');
                } else {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    window.fetchPlayers();
                }
            } catch (err) {
                errorMsg.innerText = "Lỗi máy chủ/mạng: " + err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = "Đăng Nhập";
                btn.disabled = false;
            }
        };

        window.logout = function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        };

        window.fetchPlayers = async function() {
            const tbody = document.getElementById('player-table-body');
            tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-emerald-400">Đang tải dữ liệu...</td></tr>';
            try {
                const { data, error } = await supabase.from('profiles').select('*').order('gold', { ascending: false });
                if (error) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">${error.message}</td></tr>`; return; }
                if (!data || data.length === 0) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center">Chưa có dữ liệu.</td></tr>`; return; }
                
                tbody.innerHTML = '';
                data.forEach(player => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-800">
                            <td class="p-5 font-bold">${player.username}</td>
                            <td class="p-5 text-yellow-400">🪙 ${player.gold}</td>
                            <td class="p-5 text-blue-400">🏆 ${player.rank_points}</td>
                            <td class="p-5 text-center text-gray-400">Đã ẩn tính năng sửa tạm thời để test đăng nhập</td>
                        </tr>
                    `;
                });
            } catch (err) { tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">${err.message}</td></tr>`; }
        };
    </script>
</body>
</html>
